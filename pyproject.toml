[project]
name = "kba-course-advisor"
version = "1.0.0"
description = "RAG course advisor with a deterministic academic rule engine (KBA assignment)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
neural = ["sentence-transformers>=2.7"]
notebook = ["jupyter>=1.0", "nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6.29"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["C408"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_notebook.py" = ["E501"]
